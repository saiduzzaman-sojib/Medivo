name: medivo
description: MEDIVO - Pharmacy stock and expiry planner for pharmacy chains.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  crypto: ^3.0.3
  file_picker: ^8.1.0
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ">=2.5.1 <3.0.0"
  flutter_secure_storage: ^9.2.4
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/medivo_icon.png"
  adaptive_icon_background: "#04281F"
  adaptive_icon_foreground: "assets/images/medivo_adaptive_fg.png"
  web:
    generate: true
    image_path: "assets/images/medivo_icon.png"
    background_color: "#0A1014"
    theme_color: "#3FA796"